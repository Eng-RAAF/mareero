# Serves the built Mareero app (dist-shop/) on the shop network.
server {
  listen 80;
  root /usr/share/nginx/html;

  # Build files have content hashes in their names — cache them for good
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Always check for a new app version
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: every route serves index.html
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
