# Mareero shop server — runs the whole system on one computer in the shop, so every PC on the
# shop network keeps working when the internet is down. Set up with:  npm run shop:setup
# Settings come from .env.shop (written by the setup script).
services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # database + functions
      - "3211:3211" # HTTP actions (sign-in)
    volumes:
      - data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://${SHOP_HOST:-127.0.0.1}:3210
      - CONVEX_SITE_ORIGIN=http://${SHOP_HOST:-127.0.0.1}:3211
      - DISABLE_BEACON=true
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791" # admin dashboard (data browser, logs)
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://${SHOP_HOST:-127.0.0.1}:3210
    depends_on:
      backend:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80" # the Mareero app for every PC on the network
    volumes:
      - ./dist-shop:/usr/share/nginx/html:ro
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  data:
